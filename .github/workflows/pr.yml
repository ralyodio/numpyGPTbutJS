name: Pull Request Validation

on:
  pull_request:
    branches: [ main, js-implementation ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run lint
    
    - name: Check code formatting
      run: npm run format:check
    
    - name: Run tests
      run: npm test
    
    - name: Run validation tests
      run: npm run validate
    
    - name: Build browser version
      run: npm run build:browser
    
    - name: Security audit
      run: npm audit --audit-level=moderate
    
    - name: Comment PR
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('🤖 PR Validation Results')
          );
          
          const status = '${{ job.status }}';
          const emoji = status === 'success' ? '✅' : '❌';
          const message = `🤖 PR Validation Results ${emoji}
          
          **Status:** ${status}
          **Node.js Version:** 20.x
          **Checks:**
          - Linting: ${status === 'success' ? '✅' : '❌'}
          - Formatting: ${status === 'success' ? '✅' : '❌'}
          - Tests: ${status === 'success' ? '✅' : '❌'}
          - Validation: ${status === 'success' ? '✅' : '❌'}
          - Build: ${status === 'success' ? '✅' : '❌'}
          - Security: ${status === 'success' ? '✅' : '❌'}
          
          ${status === 'success' ? 
            '🎉 All checks passed! This PR is ready for review.' : 
            '⚠️ Some checks failed. Please review the workflow logs and fix any issues.'
          }`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: message
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
          }